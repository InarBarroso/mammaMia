{% extends "index.html" %}
{% load static %}

{% block title %}Añadir Pizza{% endblock %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'css/forms.css' %}">
{% endblock %}

{%block content%}
        

                
                <div id="bloqueFormulario">
                    <h1>Añade una nueva Pizza</h1>
                     <form action="form.py" method="post">
                        <fieldset>
                            <legend>Detalles de la pizza:</legend>
                            <label for="nombre">Nombre:</label><input type="text" id="nombre" name="nombre"><br>
                            <label for="apellido">Detalles:</label><input type="text" id="detalles" name="apellido"><br>
                            <label for="telefono">Precio:</label><input type="number" id="precio" name="precio"><br>
                            
                        </fieldset>
                    
                        <fieldset>
                            <legend>Ingredientes:</legend>
                          
                            <label for="tipoMasa">Tipo de masas:</label><br>
                            <select  name="tipoMasa" id="tipoMasa">
                                    {% for masa in masas %}
                                        <option selected value={{masa.id}}>{{ masa.titulo }}</option>
                                    {% endfor %}    
                            </select>
                            <br><br>
                            <label for="todoIngredientes">Tipo de masas:</label><br>
                            <select  name="todoIngredientes" id="todoIngredientes">
                                    {% for ingrediente in ingredientes %}
                                        <option selected value={{ingrediente.id}}>{{ ingrediente.titulo }}</option>
                                    {% endfor %}    
                            </select>
                        </fieldset>
                        <input type="submit" id="entregar" name="Entregar" value="Añadir pizza">
                    
                    </form>
                </div>
           

        
        

{%endblock%}
