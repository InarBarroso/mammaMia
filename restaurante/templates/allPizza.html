{% extends "index.html" %}
{% load static %}

{% block title %}Nuestras Pizzas{% endblock %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
{% endblock %}

{%block content%}
        <main>

                <div id="portada1">
                <h1>Todas Nuestras Pizzas</h1>
                </div>
                
            </div>
            <div id="bloque_pizzas">
                <div id="tit_bloque_pizzas">
                    <h2>Las más vendidas</h2>
                </div>
                <div id="vista_pizzas">

                    {%for pizza in pizzas%}
                    <section>
                        <img src="{% static pizza.foto %}" alt="Pizza {{ pizza.titulo }}">
                        <div>
                        <h3>{{pizza.titulo}}</h3>
                        <p>{{pizza.descripcion}}</p>
                        <a href="{% url 'filtrarpizza' pizza.id %}" id="boton">Detalles</a>
                        </div>
                    </section>
                    {%endfor%}
                    
                </div>
            </div>

        
        </main>

{%endblock%}
