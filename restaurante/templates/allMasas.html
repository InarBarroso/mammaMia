{% extends "index.html" %}
{% load static %}

{% block title %}Nuestras Masas{% endblock %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    <link rel="stylesheet" href="{% static 'css/masas.css' %}">
{% endblock %}

{% block content %}
    <div id="portada1">
        <h1>Nuestras Masas</h1>
    </div>

    <div id="bloque_pizzas">
        <div id="tit_bloque_pizzas">
            <h2>Elige tu masa</h2>
        </div>
        <div id="vista_pizzas">

            {% for masa in masas %}
            <section>
                <img src="{% static masa.foto %}" alt="Masa {{ masa.titulo }}">
                <div>
                    <h3>{{ masa.titulo }}</h3>
                    <p>{{ masa.descripcion }}</p>
                    <a href="{% url 'filtrarmasa' masa.id %}" id="boton">Ver pizzas</a>
                </div>
            </section>
            {% endfor %}

        </div>
    </div>
{% endblock %}
